syntax = "proto3";

package auth;

option go_package = "github.com/dhinesh20022806/grpc_service/proto/gen;genpb";

message IsValidUserRequest {
    string email = 1;
    string password = 2;
}

message IsValidUserResponse {
    string email = 1;
    string name = 2;
    string jwt = 3;
    bool valid = 4;
}

message CreateUserRequest {
    string email = 1;
    string name = 2;
    string password = 3;
}

message CreateUserResponse {
    string email = 1;
    string name = 2;
    string jwt = 3;
    bool valid = 4;
}

message IsValidJWTRequest {
    string jwt = 1;
}

message IsValidJWTResponse {
    string id = 1;
    string email = 2;
    string name = 3;
    bool valid = 4;
}

service AuthService {
    rpc IsValidUser(IsValidUserRequest) returns (IsValidUserResponse);
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
    rpc IsValidJWT(IsValidJWTRequest) returns (IsValidJWTResponse);
}
