syntax = "proto3";

package auth.v1;



message Credentials {
    string email = 1;
    string password = 2;
}

message User {
    string email = 1;
    string name = 2;
    string jwt = 3;
    bool valid = 4;
}

message NewUser {
    string email = 1;
    string name = 2;
    string password = 3;
}

service LoginService {
    rpc IsValidUser (Credentials) returns (User);
}

service SignUpService {
    rpc CreateUser (NewUser) returns (User);
}

